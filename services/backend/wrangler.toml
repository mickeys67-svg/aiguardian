name = "tg-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# vars 는 deploy-all.ps1 가 wrangler 명령으로 채움 (또는 GitHub Actions secret).
# GH_TOKEN 은 secret 으로만 (`wrangler secret put GH_TOKEN`).
[vars]
GH_OWNER = "mickeys67-svg"
GH_REPO = "aiguardian"

[[d1_databases]]
binding = "DB"
database_name = "tg"
database_id = "7315467a-2767-42d0-86ba-47695a1427f8"

# KV — id 는 `wrangler kv namespace create CACHE` 출력 후 채움.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "REPLACE_ME"

# Custom domain — vibemate.kr Cloudflare 등록 완료 (2026-05-02).
[[routes]]
pattern = "api.vibemate.kr/*"
zone_name = "vibemate.kr"
